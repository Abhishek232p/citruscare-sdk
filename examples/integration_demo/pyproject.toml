[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "citruscare-sdk-integration-demo"
version = "0.1.0"
description = "A consumer application exercising the installed CitrusCare SDK"
requires-python = ">=3.11"
dependencies = ["citruscare-sdk==0.1.0"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
citruscare_integration_demo = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
